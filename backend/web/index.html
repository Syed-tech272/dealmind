<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DealMind — memory-powered sales intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root{
    --bg:#0a0e18; --panel:#111827; --card:#151d30; --card2:#0f1626;
    --line:rgba(255,255,255,.08); --line2:rgba(124,108,255,.25);
    --ink:#e9edf7; --mut:#94a0b8; --dim:#5f6b84;
    --accent:#7c6cff; --accent2:#22d3ee; --violetbg:rgba(124,108,255,.12);
    --good:#34d399; --goodbg:rgba(52,211,153,.14); --bad:#f87171; --badbg:rgba(248,113,113,.14); --warn:#fbbf24;
    --sans:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;
    background-image:radial-gradient(70% 50% at 100% 0,rgba(124,108,255,.10),transparent 60%),radial-gradient(60% 50% at 0 100%,rgba(34,211,238,.06),transparent 60%)}
  a{color:var(--accent2)}
  .top{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,14,24,.85);backdrop-filter:blur(8px);z-index:10}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:18px}
  .brand b{font-weight:800;letter-spacing:-.01em}.brand .sub{color:var(--mut);font-size:11.5px}
  .status{margin-left:auto;display:flex;gap:8px;font-size:11.5px;color:var(--mut);align-items:center;flex-wrap:wrap}
  .pill{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--card)}
  .pill.ok{color:var(--good);border-color:rgba(52,211,153,.35)}
  .pill.bad{color:var(--bad);border-color:rgba(248,113,113,.35)}
  .wrap{display:grid;grid-template-columns:290px 1fr 340px;gap:0;height:calc(100vh - 63px)}
  @media(max-width:1100px){.wrap{grid-template-columns:1fr}.rail,.side{display:none}}
  /* sidebar */
  .side{border-right:1px solid var(--line);overflow-y:auto;padding:14px}
  .side h3,.rail h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:6px 4px 12px}
  .deal{padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer;background:var(--card);transition:.15s}
  .deal:hover{border-color:var(--line2);transform:translateY(-1px)}
  .deal.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 10px 30px rgba(124,108,255,.14)}
  .deal .n{font-weight:600}
  .deal .r{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--mut)}
  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
  .b-open{background:var(--violetbg);color:#b9b0ff}.b-won{background:var(--goodbg);color:var(--good)}.b-lost{background:var(--badbg);color:var(--bad)}
  /* main */
  .main{overflow-y:auto;padding:22px 26px}
  .head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}
  .head h1{margin:0;font-size:24px;letter-spacing:-.01em}
  .head .meta{color:var(--mut);font-size:13px;margin-top:4px}
  .head .val{margin-left:auto;text-align:right}
  .head .val .big{font-family:var(--mono);font-size:22px;color:var(--ink)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .btn{font-family:var(--sans);font-weight:600;font-size:13.5px;border:0;cursor:pointer;padding:11px 18px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#5b4be0);color:#fff;box-shadow:0 8px 22px rgba(124,108,255,.3);display:inline-flex;align-items:center;gap:8px;transition:.15s}
  .btn:hover{transform:translateY(-1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
  .card .lb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .md h3{font-size:14px;color:#c7b9ff;margin:16px 0 6px;letter-spacing:.01em}
  .md h3:first-child{margin-top:0}
  .md p{margin:6px 0}.md ol,.md ul{margin:6px 0 6px 4px;padding-left:18px}.md li{margin:5px 0}
  .md strong{color:var(--ink);font-weight:700}
  .md code{font-family:var(--mono);font-size:12px;background:rgba(124,108,255,.12);padding:1px 5px;border-radius:5px;color:#c7b9ff}
  .cross{background:linear-gradient(180deg,rgba(124,108,255,.10),transparent);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;margin-top:6px}
  .cross .m{font-size:12.5px;color:var(--ink);padding:7px 0;border-bottom:1px dashed var(--line)}
  .cross .m:last-child{border:0}
  .cross .from{display:inline-block;font-size:10px;font-weight:700;color:var(--accent2);background:rgba(34,211,238,.12);border-radius:6px;padding:1px 7px;margin-right:7px}
  textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--ink);font-family:var(--sans);font-size:13.5px;padding:12px;resize:vertical;min-height:120px}
  textarea:focus{outline:none;border-color:var(--accent)}
  pre.email{white-space:pre-wrap;font-family:var(--sans);font-size:13.5px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0}
  .kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--mut);background:var(--card2)}
  .chip.obj{color:#ffb4b4;border-color:rgba(248,113,113,.3)}
  .chip.comp{color:#ffd591;border-color:rgba(251,191,36,.3)}
  /* memory rail */
  .rail{border-left:1px solid var(--line);overflow-y:auto;padding:16px;background:linear-gradient(180deg,rgba(124,108,255,.06),transparent 30%)}
  .rail .count{font-family:var(--mono);font-size:12px;color:var(--accent2)}
  .mem{background:var(--card);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:10px;padding:10px 12px;margin-bottom:9px;font-size:12.6px;animation:pop .4s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .mem .tag{display:flex;gap:6px;margin-bottom:5px;flex-wrap:wrap}
  .mem .t{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:var(--violetbg);color:#b9b0ff}
  .mem .t.won{background:var(--goodbg);color:var(--good)}.mem .t.lost{background:var(--badbg);color:var(--bad)}
  .empty{color:var(--dim);text-align:center;padding:40px 20px;font-size:13px}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hint{font-size:12px;color:var(--dim);margin:2px 4px 10px}
</style>
</head>
<body>
<div class="top">
  <div class="logo">🧠</div>
  <div class="brand"><b>DealMind</b><div class="sub">Memory-powered sales intelligence · built on Hindsight</div></div>
  <div class="status" id="status"><span class="pill">connecting…</span></div>
</div>

<div class="wrap">
  <!-- deals -->
  <aside class="side">
    <h3>Pipeline</h3>
    <div id="deals"></div>
  </aside>

  <!-- workspace -->
  <main class="main" id="main">
    <div class="empty">Select a deal to see what the agent remembers.</div>
  </main>

  <!-- memory -->
  <aside class="rail">
    <h3>🧠 Memory <span class="count" id="memCount"></span></h3>
    <div class="hint">What the agent knows about this deal — recalled live from Hindsight. It grows every time you log a call.</div>
    <div id="mem"><div class="empty">—</div></div>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
let deals = [], cur = null;

async function api(path, opts){ const r = await fetch(path, opts); if(!r.ok) throw new Error((await r.text())||r.status); return r.json(); }
function badge(o){ return o==='won'?'<span class="badge b-won">WON</span>':o==='lost'?'<span class="badge b-lost">LOST</span>':'<span class="badge b-open">OPEN</span>'; }
function md(t){ // tiny markdown -> html
  if(!t) return '';
  const esc = s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  let h = esc(t)
    .replace(/^### (.*)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`(.+?)`/g,'<code>$1</code>');
  // lists
  const lines = h.split('\n'); let out='',inOl=false,inUl=false;
  for(let ln of lines){
    if(/^\d+\.\s/.test(ln)){ if(!inOl){out+='<ol>';inOl=true} out+='<li>'+ln.replace(/^\d+\.\s/,'')+'</li>'; continue; }
    if(inOl){out+='</ol>';inOl=false}
    if(/^[-*]\s/.test(ln)){ if(!inUl){out+='<ul>';inUl=true} out+='<li>'+ln.replace(/^[-*]\s/,'')+'</li>'; continue; }
    if(inUl){out+='</ul>';inUl=false}
    if(/^<h3>/.test(ln)) out+=ln; else if(ln.trim()) out+='<p>'+ln+'</p>';
  }
  if(inOl)out+='</ol>'; if(inUl)out+='</ul>';
  return out;
}

async function boot(){
  try{
    const h = await api('/health');
    $('#status').innerHTML =
      `<span class="pill ${h.groq_key?'ok':'bad'}">Groq ${h.groq_key?'✓':'no key'}</span>`+
      `<span class="pill ${h.memory_ok?'ok':'bad'}">Hindsight ${h.memory_ok?'✓':'offline'}</span>`+
      `<span class="pill">${h.groq_model}</span>`;
  }catch(e){ $('#status').innerHTML='<span class="pill bad">backend offline</span>'; }
  deals = await api('/deals');
  renderDeals();
}
function renderDeals(){
  $('#deals').innerHTML = deals.map(d=>`
    <div class="deal ${cur&&cur.id===d.id?'on':''}" onclick="selectDeal('${d.id}')">
      <div class="n">${d.name}</div>
      <div class="r"><span>${d.stage} · $${(d.value||0).toLocaleString()}</span>${badge(d.outcome)}</div>
    </div>`).join('');
}

async function selectDeal(id){
  cur = await api('/deals/'+id); renderDeals(); renderMain(); loadMemory();
}
function renderMain(){
  const d=cur;
  $('#main').innerHTML = `
    <div class="head">
      <div>
        <h1>${d.name} ${badge(d.outcome)}</h1>
        <div class="meta">${d.company} · ${d.stage} · ${d.contact||''}</div>
      </div>
      <div class="val"><div class="sub" style="color:var(--mut);font-size:11px">DEAL VALUE</div><div class="big">$${(d.value||0).toLocaleString()}</div></div>
    </div>
    <div class="actions">
      <button class="btn" id="briefBtn" onclick="doBrief()">✨ Brief me for the call</button>
      <button class="btn ghost" onclick="showLog()">➕ Log a call</button>
      <button class="btn ghost" onclick="doFollowup()">✉️ Draft follow-up</button>
    </div>
    <div id="log"></div>
    <div id="brief"></div>
    <div id="followup"></div>`;
}

async function doBrief(){
  const el=$('#brief'); el.innerHTML=`<div class="card"><div class="lb">✨ Pre-call brief</div><div><span class="spin"></span> recalling this deal + winning moves from other deals…</div></div>`;
  try{
    const b = await api('/deals/'+cur.id+'/brief');
    const cross = (b.cross||[]).slice(0,5).map(m=>`<div class="m"><span class="from">${(m.metadata&&m.metadata.deal_name)||'past deal'}</span>${m.text}</div>`).join('');
    el.innerHTML = `<div class="card">
      <div class="lb">✨ Pre-call brief <span style="color:var(--mut);font-weight:500;text-transform:none;letter-spacing:0">· generated from memory</span></div>
      <div class="md">${md(b.brief)}</div>
      ${cross?`<div style="margin-top:14px"><div class="lb" style="color:var(--accent2)">🔁 Learned from other deals</div><div class="cross">${cross}</div></div>`:''}
    </div>`;
  }catch(e){ el.innerHTML=`<div class="card" style="border-color:var(--bad)">Brief failed — ${e.message}</div>`; }
}

function showLog(){
  $('#log').innerHTML = `<div class="card">
    <div class="lb">➕ Log a call</div>
    <textarea id="notes" placeholder="Paste raw call notes… e.g. 'Spoke with Ravi and the CFO. CFO says we're 30% over Databricks. They also asked if we're SOC2 compliant and where data is hosted. Ravi still loves it. Agreed to a pricing + security call next week.'"></textarea>
    <div style="margin-top:10px"><button class="btn" id="logBtn" onclick="doLog()">Extract & remember →</button></div>
    <div id="logout"></div>
  </div>`;
}
async function doLog(){
  const notes=$('#notes').value.trim(); if(!notes) return;
  $('#logBtn').disabled=true; $('#logBtn').innerHTML='<span class="spin"></span> extracting…';
  try{
    const d = await api('/deals/'+cur.id+'/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({notes})});
    const chips = (arr,cls)=> (arr||[]).map(x=>`<span class="chip ${cls}">${x}</span>`).join('');
    $('#logout').innerHTML = `<div style="margin-top:14px">
      <div style="color:var(--good);font-weight:600;margin-bottom:8px">✓ ${(d.memories||[]).length} new memories stored</div>
      <div><b>${d.summary||''}</b></div>
      <div class="kv">${chips(d.objections,'obj')}${chips(d.competitors,'comp')}</div>
      <div style="color:var(--mut);font-size:12.5px;margin-top:8px">Sentiment: ${d.sentiment||'—'} · Next: ${d.next_step||'—'}</div>
    </div>`;
    loadMemory(); // watch the memory panel grow
  }catch(e){ $('#logout').innerHTML=`<div style="color:var(--bad);margin-top:10px">Failed — ${e.message}</div>`; }
  $('#logBtn').disabled=false; $('#logBtn').innerHTML='Extract & remember →';
}

async function doFollowup(){
  const el=$('#followup'); el.innerHTML=`<div class="card"><div class="lb">✉️ Follow-up</div><div><span class="spin"></span> drafting from recalled context…</div></div>`;
  try{
    const f = await api('/deals/'+cur.id+'/followup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({intent:'move the deal forward'})});
    el.innerHTML = `<div class="card"><div class="lb">✉️ Personalised follow-up</div><pre class="email">${f.email.replace(/</g,'&lt;')}</pre></div>`;
  }catch(e){ el.innerHTML=`<div class="card" style="border-color:var(--bad)">Follow-up failed — ${e.message}</div>`; }
}

async function loadMemory(){
  $('#mem').innerHTML='<div class="empty"><span class="spin"></span></div>';
  try{
    const r = await api('/deals/'+cur.id+'/memory');
    const ms = r.memories||[];
    $('#memCount').textContent = `(${ms.length})`;
    $('#mem').innerHTML = ms.length ? ms.map(m=>{
      const o=(m.metadata&&m.metadata.outcome)||'open';
      const dn=(m.metadata&&m.metadata.deal_name)||'';
      return `<div class="mem"><div class="tag"><span class="t ${o}">${o}</span>${dn?`<span class="t" style="background:rgba(34,211,238,.12);color:var(--accent2)">${dn}</span>`:''}</div>${m.text}</div>`;
    }).join('') : '<div class="empty">No memories yet — log a call.</div>';
  }catch(e){ $('#mem').innerHTML=`<div class="empty">memory unavailable</div>`; }
}

boot();
</script>
</body>
</html>
